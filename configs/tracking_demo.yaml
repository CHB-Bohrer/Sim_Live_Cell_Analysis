# Cells-only tracking test: stage 2 (motion) -> stage 3 (nuclear channel) -> stage 4 (segment + track) -> stage 7 (score).
# Override anything from the command line, e.g.  --set motion.D_um2_s=0.05 --set seed=2
name: tracking_demo
seed: 1

acquisition:
  n_frames: 40
  frame_interval_s: 300     # time between frames
  exposure_s: 0.1

geometry:
  fov_um: [140, 140]        # (y, x) field of view
  cell_radius_um: 6.0       # equivalent-circle nuclear radius
  shape:                    # irregular nuclei: ellipse + boundary bumps/dents, evolving over time
    aspect_mean: 1.25       # long/short axis ratio (1 = circle)
    aspect_std: 0.12
    harmonics: [2, 3, 4, 5] # boundary perturbation: rho = 1 + sum_k amp_k cos(k*theta + phase_k)
    deform_amp: 0.07        # std of each harmonic amplitude (0 = smooth ellipses; ~0.15 = strongly lobed)
    persistence: 0.9        # per-frame memory of the shape (1 = frozen, 0 = new shape every frame)
    rot_diffusion_rad: 0.1  # random rotation per frame

cells:
  n_cells: 25
  p_divide_per_frame: 0.01  # >0 enables division (e.g. 0.01)
  max_cells: 45

motion:                     # per-cell persistent random walk + collisions
  speed_scale: 1.0          # multiplies all cell displacements (0.5 = half as far per frame, 0 = frozen)
  D_um2_s: 0.03             # diffusion coefficient; step sigma = sqrt(2 D dt) per axis
  drift_um_s: 0.008         # directed speed (0 = purely diffusive)
  heading_diffusion_rad: 0.3

optics:                     # nuclear (NLS-GFP) channel
  modality: widefield
  wavelength_nm: 509
  NA: 1.2
  pixel_size_nm: 650
  photons_per_px_s: 3000    # peak nuclear photon flux per pixel
  brightness_cv: 0.3        # cell-to-cell brightness variation
  bleach_tau_s: 20000       # photobleaching time constant (null = none)
  background_photons: 5
  quantum_efficiency: 0.8
  read_noise_e: 1.5
  gain_adu_per_e: 1.0
  offset_adu: 100

nucleus_texture:            # intra-nuclear structure (fixed to each nucleus; rotates/deforms with it)
  contrast: 0.30            # std of chromatin-like intensity variation (0 = uniform)
  correlation_um: 1.5       # feature size of that variation
  n_nucleoli: 2             # mean number of dark nucleoli per nucleus (NLS-GFP excluded)
  nucleolus_depth: 0.55     # 0 = invisible, 1 = completely dark

segmentation:
  method: cellpose          # cellpose | threshold_watershed
  # cellpose:
  diameter_px: null         # null = automatic
  flow_threshold: 0.4
  cellprob_threshold: 0.0
  # threshold_watershed:
  smooth_px: 1.5
  min_area_px: 20
  min_distance_px: 5

tracking:
  tracker: trackastra
  model: general_2d
  mode: greedy




# Sources of image error (stage 3). Each has its own switch; `enabled: false` at the top turns the whole block off and leaves only the
# original model (blur, bleaching, constant background, QE, shot noise, read noise). All values are PLACEHOLDERS until measured on the
# real microscope; see src/simlive/stage3_microscopy/errors.py (or the dashboard's Images tab) for what each one does.
imaging_errors:
  enabled: true
  # ---- Sample position
  stage_drift: {enabled: true, drift_px_per_frame: 0.15, jitter_px: 0.05}
  chromatic_shift: {enabled: true, shift_px: {"locus0": [0.25, -0.15], "locus1": [-0.3, 0.2]}}
  # ---- Optics
  psf_blur: {enabled: true}          # Diffraction blur (PSF)
  defocus: {enabled: true, rms_um: 0.1, memory: 0.9, immersion_n: 1.33}
  exposure_motion: {enabled: true, locus_sigma_nm: 25.0}
  haze: {enabled: true, fraction: 0.06, sigma_um: 2.5}
  # ---- Illumination
  bleaching: {enabled: true}          # Photobleaching
  flat_field: {enabled: true, vignette: 0.15, tilt: 0.03}
  flicker: {enabled: true, cv: 0.01, memory: 0.8}
  # ---- Background
  background: {enabled: true}          # Constant background light
  autofluorescence: {enabled: true, photons: 6.0, cv: 0.3, correlation_um: 10.0}
  crosstalk: {enabled: true, pairs: [["nucleus", "locus0", 0.02], ["locus0", "locus1", 0.02]]}
  # ---- Detection
  qe: {enabled: true}          # Quantum efficiency
  shot_noise: {enabled: true, excess_noise_factor: 1.0}
  dark_current: {enabled: true, e_per_s: 0.2}
  # ---- Camera electronics
  hot_pixels: {enabled: true, fraction: 0.0003, e_per_frame: 40.0}
  cosmic_rays: {enabled: true, rate_per_frame: 0.05, e: 3000.0}
  prnu: {enabled: true, cv: 0.01}
  read_noise: {enabled: true, pixel_cv: 0.25}
  row_noise: {enabled: true, adu: 0.6}
  dsnu: {enabled: true, adu: 1.0}
  adc: {enabled: true, bit_depth: 16, full_well_e: 30000.0}
