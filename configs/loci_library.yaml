# Single-cell locus pipeline: cells + stand-in loci -> segment/track -> isolate each cell -> per-cell locus analysis.
#   scripts\run.cmd python scripts\run_tracking_demo.py --config configs\loci_demo.yaml
# Locus imaging needs fine pixels (130 nm), so the field is smaller and holds fewer cells than tracking_demo.yaml.
name: loci_library
seed: 1
image_dtype: uint16        # store images as 16-bit integers like a real camera (float32 = double the memory)

acquisition:
  n_frames: 120
  frame_interval_s: 10
  exposure_s: 0.1

geometry:
  fov_um: [80, 80]
  outside_um: 0             # room around the field where cells live out of view (they can walk in and out); 0 = walls at the image edge
  cell_radius_um: 6.0
  shape:
    aspect_mean: 1.25
    aspect_std: 0.12
    harmonics: [2, 3, 4, 5]
    deform_amp: 0.07
    persistence: 0.9
    rot_diffusion_rad: 0.1

cells:
  n_cells: 8
  p_divide_per_frame: 0.0
  max_cells: 20

motion:
  speed_scale: 0.4          # cells move ~0.3 um per frame at this frame interval
  D_um2_s: 0.03
  drift_um_s: 0.008
  heading_diffusion_rad: 0.3

optics:                     # nuclear channel (NLS-GFP)
  modality: widefield
  wavelength_nm: 509
  NA: 1.2
  pixel_size_nm: 130
  photons_per_px_s: 3000
  brightness_cv: 0.3
  bleach_tau_s: 20000
  background_photons: 5
  quantum_efficiency: 0.8
  read_noise_e: 1.5
  gain_adu_per_e: 1.0
  offset_adu: 100

nucleus_texture:
  contrast: 0.30
  correlation_um: 1.5
  n_nucleoli: 2
  nucleolus_depth: 0.55

loci:                       # source: library = saved polychrom simulations (needs a finished library); toy = stand-in
  source: library
  library: loop_extrusion          # folder under $SIMLIVE_DATA/chromatin/
  positions_kb: random           # `random` = every cell draws its own pair (below); or a fixed list [promoter_kb, enhancer_kb] (kb, multiples of 10), e.g. [5050, 4950]
  pair_separation_kb: 100        # random pairs: promoter-enhancer distance along the chain
  pair_margin_kb: 1000           # random pairs: keep both loci this far from the ends of the simulated region
  calibration: default           # polymer units -> nm and seconds: configs/calibration/default.json (scripts/calibrate_chromatin.py; ASSUMED contact fraction 0.1 at 400 nm
                                 # for a 100 kb pair and single-locus D = 0.002 um^2/s at 1 min). Remove this line to use the two numbers below instead.
  # block_duration_s: 10         # seconds per saved block: if given, overrides the calibration's (the old PLACEHOLDER was 10)
  # nm_per_unit: 50              # nm per polymer length unit: if given, overrides the calibration's (the old PLACEHOLDER was 50); region keeps its true size
  # Which simulation does each cell get?  Default: a seeded random draw from every finished simulation in the library.
  sim_ids: null                  # or a list, e.g. [loop_extrusion_seed1003, loop_extrusion_seed1010]: only draw from these
  pin: null                      # or a map {cell_id: sim_id}, e.g. {1: loop_extrusion_seed1003}: force that cell onto that simulation
  replace: false                 # true = cells may share a simulation when cells > simulations
  n_loci: 2
  # toy-only: confinement_std: 0.10     # spread of locus position, in units of the nuclear radius (0.1 x 6 um = 0.6 um)
  # toy-only: tau_s: 120                # relaxation time of the confined motion
  wavelengths_nm: [580, 660]  # one colour channel per locus (locus0, locus1)
  photons_per_locus_s: 6000   # photons per locus per second of exposure (x exposure_s = 600 per frame)
  bleach_tau_s: 6000
  probes:                    # stochastic probe binding at each locus (stage 1b); locus 0 = promoter, locus 1 = enhancer
    enabled: false           # true: locus brightness = photons_per_probe_s x (probes attached) and fluctuates in time
    photons_per_probe_s: 300 # PLACEHOLDER photons per attached probe per second of exposure
    promoter: {n_probes: 30, k_bind: 0.05, k_scan: 0.5, k_unbind: 0.1, k_off: 0.1, capacity: null}    # rates in 1/s
    enhancer: {n_probes: 30, k_bind: 0.03, k_scan: 0.3, k_unbind: 0.1, k_off: 0.05, capacity: null}
  copies:                    # several promoter-enhancer pairs per cell (stage1_chromatin/copies.py; user 2026-10-19). Absent = one pair per cell
    n: [1, 2]                # possible numbers of pairs per cell (e.g. 2 = both homologous alleles labelled, 4 = after replication) ...
    weights: [0.5, 0.5]      # ... and the share of cells with each (PLACEHOLDER: half the cells show two pairs)
    min_separation_um: 2.5   # the pairs' territories at least this far apart in the image plane (PLACEHOLDER; homologs are often several um apart)
    ms2: all                 # which pairs carry the MS2 cassette: all | first (the others still transcribe, unlabelled)
    transcription: [{}, {k_on: 0.00167}]   # per-pair overrides of transcription.params: separate bursting dynamics (PLACEHOLDER: pair 1 bursts twice as often)
  transcription:             # stage 1c: promoter switching + Pol II + MS2; the rate can depend on promoter-enhancer distance
    enabled: false           # true: MS2 spots appear at the promoter, in the SAME channel as the nuclear NLS-GFP
    photons_per_loop_s: 100  # PLACEHOLDER photons per MS2 loop per second of exposure (one Pol II with all 24 loops = 24x this)
    params:                  # all rates per SECOND of real time (independent of the frame interval); see docs/PLAN_transcription.md
      # SPIKY PLACEHOLDER (user, 2026-10-13: "even more bursty", little accumulated signal): brief bursts of ~7 Pol II, short residence
      k_on: 0.000833         # OFF -> ON when the enhancer is far (1/1200 s: mean OFF 20 min)
      k_off: 0.0222          # ON -> OFF (1/45 s: bursts last 45 s)
      k_init: 0.15           # Pol II initiations per second while ON (one every ~7 s): ~7 Pol II per burst
      # (first bursty version: k_on 1/900, k_off 1/120, k_init 0.2 -> 24 Pol II per 2-min burst, gene 5 kb, dwell 116 s: broad humps)
      # previous, TFF1-like (literature, ~1.6 Pol II per burst, barely bursty in MS2): k_on 0.000333 (OFF 50 min), k_off 0.00104 (ON 16 min),
      # k_init 0.00167 (one per 600 s); TFF1 burst period 66 min, ON 16 min, 1.5 transcripts per burst (Rodriguez 2019)
      coupling: hill         # contact (sharp) | hill | exp | none (control). hill since 2026-10-20 (the user's E-P choice of 2026-10-14):
      #   the sharp 150 nm contact was reached in only 0.75% of frames by the library distances (400 nm: 11.8%), so it barely coupled
      coupled_rate: k_on     # which rate depends on distance: k_on | k_init | k_off
      fold: 12               # coupled rate is this many times faster at full contact
      d_contact_nm: 150      # sharp contact: enhancer touches promoter when closer than this
      d_half_nm: 400         # hill: distance of half effect (n = 4: 6% of full effect at 800 nm, 94% at 200 nm)
      hill_n: 4
      d_decay_nm: 150        # exp: decay length
      f_const: 0.1           # none: constant coupling (control with the same average)
      elongation_kb_min: 2.5 # Pol II speed (human genes: ~1-6 kb/min)
      cassette_kb: 1.3       # MS2 cassette at the 5' end
      gene_kb: 2.0           # gene after the cassette (PLACEHOLDER short gene: a Pol II crosses cassette + gene in ~80 s)
      n_loops: 24
      dwell_s: 20            # mean wait at the end of the gene before release (PLACEHOLDER; Coulon 2014 measured 116 s for their gene)

isolation:                  # stage 5: one single-cell movie per cell ID
  sources: [truth, tracked_auto_masks]   # truth | tracked_gt_masks | tracked_auto_masks
  margin: 0.3               # extra crop room around the largest cell (fraction of its radius)
  n_workers: null           # null = CPU cores - 2 (max 8); 1 = no multiprocessing
  min_frames: 1

locus_analysis:             # stage 6 spot finder: src/simlive/stage6_analysis/dog_viterbi.py, docs/SPOT_FINDING.md, dashboard tab 🔎 Spot finding
  method: dog_viterbi       # dog_viterbi = Chen, Levo, Zoller & Gregor 2025 (NSMB) spot pipeline | brightest = the original placeholder
  median_px: 3              # median filter against salt-and-pepper noise (a spot is ~2 px wide)
  median_z: auto            # z-stacks: axial median over 3 planes if the plane spacing <= axial PSF sigma (removes one-plane cosmic rays), else 1
  dog_sigma_px: [1.0, 3.0]  # difference of Gaussians: inner ~ PSF sigma, outer 3x (px)
  dog_sigma_z: [0.8, 2.0]   # z-stacks: the same along z (planes)
  dog_snr: 3.0              # candidate threshold (x noise of the DoG image): low on purpose, the Viterbi path picks the spot
  max_candidates: 8         # candidates kept per frame (5 for one copy without stray spots; 8 leaves room for two copies + strays)
  min_sep_px: 4             # min distance between candidates (px)
  viterbi_miss_cost: 2.0    # cost of a frame without a spot (nats)
  viterbi_max_gap: 5        # longest run of frames without a spot that a path may bridge
  viterbi_D_px2: null       # diffusion potential (px^2 per frame); null = re-estimated from the path itself
  refine: gaussian          # position: gaussian fit | centroid (the paper) | none (integer pixel)
  smooth_sigma_px: 1.0      # starting width of the Gaussian fit; also the smoothing of method brightest
  min_snr: 5.0              # method brightest only
  dilate_px: 2              # grow the cell mask by this much (PSF halo of loci at the nuclear edge)
  # spot intensity = mean in an ellipsoid minus the background of the shell around it (Chen et al. 2025), diameters (x, y, z) in px / planes
  intensity_inner_px: [7, 7, 5]
  intensity_outer_px: [19, 19, 7]
  intensity_background: median   # median of the shell (robust to a cosmic ray in it) | mean (Chen et al. 2025)
  # several copies per cell and stray spots (multicopy.py): paths per colour, the loci among them by coverage, promoter paired with enhancer
  max_copies: 2             # most promoter-enhancer copies a cell can have (1 = the one-copy finder of Chen et al.)
  extra_tracks: 2           # paths tried per colour beyond max_copies, so loci can be found among stray spots
  min_track_coverage: 0.5   # a second or later path is a locus only if it has a spot in >= this share of the frames (strays live ~1 min)
  pair_max_um: 1.5          # promoter and enhancer paths of one copy: median distance at most this
  pair_prior: gauss         # how the other colour of a copy helps choose spots: gauss (default: fewest wrong picks, separates close copies; drops ~2% of frames, mostly far ones) | gate (flat 1.5 um window) | none (docs/SPOT_FINDING.md)
  pair_gate_um: 1.5         # candidates farther than this from the other colour's spot of the same copy are penalised (null = off)
  gate_softness_px: 2.0

segmentation:
  method: cellpose
  diameter_px: auto         # "auto" = 2 x nuclear radius / pixel size; or a number; or null for Cellpose default
  flow_threshold: 0.4
  cellprob_threshold: 0.0
  smooth_px: 1.5
  min_area_px: 20
  min_distance_px: 5

tracking:
  tracker: trackastra
  model: general_2d
  mode: greedy




# Sources of image error (stage 3). Each has its own switch; `enabled: false` at the top turns the whole block off and leaves only the
# original model (blur, bleaching, constant background, QE, shot noise, read noise). All values are PLACEHOLDERS until measured on the
# real microscope; see src/simlive/stage3_microscopy/errors.py (or the dashboard's Images tab) for what each one does.
imaging_errors:
  enabled: true
  # ---- Sample position
  stage_drift: {enabled: true, drift_px_per_frame: 0.15, jitter_px: 0.05, drift_z_um_per_frame: 0.03, jitter_z_um: 0.02}
  chromatic_shift: {enabled: true, shift_px: {"locus0": [0.25, -0.15], "locus1": [-0.3, 0.2]}, shift_z_um: {"locus0": 0.15, "locus1": -0.2}}
  sequential_colour: {enabled: false, order: ["nucleus", "locus0", "locus1"], delay_s: 0.15}   # colours exposed one after another (on in configs/instruments/vutara_vxl.yaml)
  slice_skew: {enabled: true}          # Time skew within a z-stack
  piezo: {enabled: true, repeatability_nm: 30.0, bow_um: 0.1, hysteresis_um: 0.05, settling_um: 0.04, bidirectional: true, readout_noise_nm: 5.0}
  # ---- Optics
  psf_blur: {enabled: true}          # Diffraction blur (PSF)
  defocus: {enabled: true, rms_um: 0.1, memory: 0.9, immersion_n: 1.33}
  exposure_motion: {enabled: true, locus_sigma_nm: 25.0}
  haze: {enabled: true, fraction: 0.06, sigma_um: 2.5}
  # ---- Illumination
  bleaching: {enabled: true, per_cell: true, lit_margin_um: 0.0}   # per_cell: each cell bleaches by the light it received (flat-field along its path; 0 outside the lit area)
  flat_field: {enabled: true, vignette: 0.15, tilt: 0.03}
  flicker: {enabled: true, cv: 0.01, memory: 0.8}
  # ---- Background
  background: {enabled: true}          # Constant background light
  autofluorescence: {enabled: true, photons: 6.0, cv: 0.3, correlation_um: 10.0}
  cytoplasm: {enabled: true, radius_factor: 1.8, nucleus_fraction: 0.08, locus_photons: 2.0}   # PLACEHOLDER cell bodies (2D only)
  stray_spots: {enabled: true, rate_per_min: 1.0, lifetime_s: 60.0, D_um2_s: 0.01, brightness: 0.7, brightness_cv: 0.5, channels: ["locus0", "locus1", "nucleus"]}   # PLACEHOLDER decoy spots (probe / MCP aggregates) inside nuclei
  crosstalk: {enabled: true, pairs: [["nucleus", "locus0", 0.02], ["locus0", "locus1", 0.02]]}
  # ---- Detection
  qe: {enabled: true}          # Quantum efficiency
  shot_noise: {enabled: true, excess_noise_factor: 1.0}
  dark_current: {enabled: true, e_per_s: 0.2}
  # ---- Camera electronics
  hot_pixels: {enabled: true, fraction: 0.0003, e_per_frame: 40.0}
  cosmic_rays: {enabled: true, rate_per_frame: 0.05, e: 3000.0}
  prnu: {enabled: true, cv: 0.01}
  read_noise: {enabled: true, pixel_cv: 0.25}
  row_noise: {enabled: true, adu: 0.6}
  dsnu: {enabled: true, adu: 1.0}
  adc: {enabled: true, bit_depth: 16, full_well_e: 30000.0}

# the instrument is estimated from them blindly (stage3_microscopy/calibration), and compared with the truth. All acquisition settings are PLACEHOLDERS.
calibration:
  simulate: true            # acquire and fit (about 15 s at 130 nm pixels, 40 um field; longer for larger fields and z-stacks)
  apply: true               # also locate the loci with the calibration applied (dark/flat/hot-pixel correction, chromatic shift removed): a second set of scores

# Fiducial beads: a few bright sub-resolution beads on the slide, visible in every image and in every colour. They let the analysis measure how far each
# frame has moved (stage drift, focus error). In a z-stack the stack must reach down to the slide (z_um above the coverslip) for them to be seen.
fiducials:
  enabled: false
  n_beads: 8
  photons: 20000           # PLACEHOLDER photons per bead per plane when in focus
  z_um: 0.3                # height above the coverslip (beads sit on the slide)
  min_distance_um: 3.0     # beads are placed at least this far from every nucleus (at every time)
  min_separation_um: 8.0
