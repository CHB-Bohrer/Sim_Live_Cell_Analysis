# Tiny end-to-end check that the chromatin engine runs (about 1 minute on the GPU). Not for science.
name: smoke_test
polymer:
  n_monomers: 3000          # 1 monomer = 1 kb, so 3 Mb
  density: 0.1              # monomers per unit volume inside the confining sphere
  bond_wiggle: 0.1
  angle_k: 1.5
  repulsion_trunc: 1.5
  radius_mult: 1.05
dynamics:
  steps_per_block: 750
  equilibration_blocks: 100
  production_blocks: 100
  full_every_blocks: 10
  track_stride: 10
  collision_rate: 0.03
extrusion:                  # remove this whole block for a plain confined polymer
  separation_kb: 120
  processivity_kb: 200
  lef_steps_per_block: 1
  warmup_lifetimes: 10
  bond_length: 0.5
  bond_wiggle: 0.2
  ctcf: {mode: tads, mean_tad_kb: 600, stall: 0.95, seed: 7}
