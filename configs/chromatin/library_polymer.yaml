# Library config 1/2: plain confined polymer (no loop extrusion).
# Region size is a plain setting: polymer.n_monomers (1 monomer = 1 kb). 10,000 = a 10 Mb region (the size validated in
# docs/chromatin_validation.md; ~11 min per simulation). Larger regions cost roughly in proportion to their size
# (46,700 monomers ran at about half the speed per step).
name: library_polymer
polymer:
  n_monomers: 10000
  density: 0.1
  bond_wiggle: 0.1
  angle_k: 1.5
  repulsion_trunc: 1.5
  radius_mult: 1.05
dynamics:
  steps_per_block: 750
  equilibration_blocks: 1000
  production_blocks: 2000
  full_every_blocks: 20
  track_stride: 10          # store every 10th monomer (10 kb) at EVERY production block, for locus trajectories
  collision_rate: 0.03
