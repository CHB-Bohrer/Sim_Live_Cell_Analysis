# Chromosome-21-scale library 1/2: plain confined polymer (no loop extrusion)
name: chr21_polymer
polymer:
  n_monomers: 46710         # chromosome 21 (hg38: 46.7 Mb) at 1 kb per monomer
  density: 0.1
  bond_wiggle: 0.1
  angle_k: 1.5
  repulsion_trunc: 1.5
  radius_mult: 1.05
dynamics:
  steps_per_block: 750
  equilibration_blocks: 1500
  production_blocks: 2000
  full_every_blocks: 20
  track_stride: 10          # store every 10th monomer (10 kb) at EVERY production block, for locus trajectories
  collision_rate: 0.03
