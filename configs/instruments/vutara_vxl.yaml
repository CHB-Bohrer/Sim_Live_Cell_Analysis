# Bruker Vutara VXL, used as a live-cell widefield microscope in its widefield ("bypass") mode: ONE focal plane per image (the biplane acquisition is a separate mode: see docs/INSTRUMENTS.md).
# Use it on any config:   --set instrument=vutara_vxl     (or `instrument: vutara_vxl` in the YAML). Explicit --set values still win.
#
# Every value is either SOURCED (fetched 2026-10-13, see docs/INSTRUMENTS.md for links) or marked ASSUMED (check on your instrument).
#   [Bruker]   Vutara VXL product page: 60x 1.3 NA silicone-oil objective; Orca Flash 4.0 V3 (standard) or Orca Fusion BT (optional) sCMOS;
#              lasers 405 / 488 (optional) / 555 / 638 / 750 (optional) nm; top-hat illumination from a square fibre ("flat excitation");
#              sequential multicolour up to 5 colours, simultaneous 2 colours only with an optional second camera; field of view 200 x 200 um
#              (widefield) or 50 x 50 um (biplane); focus drift < 30 nm over 10 min with active focus correction.
#   [Bruker-biplane]  two focal planes 600 nm apart in the sample, 50:50 beam splitter, both on one camera.
#   [News-Medical 2025]  Orca Fusion BT, quantum efficiency 95%; "around 100 nanometers per pixel".
#   [FPbase EGFP]  excitation at 555 nm = 0.0042 of the peak; 8.6% of the emission falls in 570-620 nm vs 71.7% in 500-550 nm.
instrument_info:
  name: Bruker Vutara VXL (widefield mode)
  colour_mode: sequential
optics:
  modality: widefield            # top-hat epi-illumination [Bruker]
  NA: 1.3                        # [Bruker]
  immersion_n: 1.406             # ASSUMED: silicone immersion oil (not given on the Vutara pages)
  pixel_size_nm: 100             # [News-Medical 2025] "around 100 nm"
  quantum_efficiency: 0.95       # Orca Fusion BT [News-Medical 2025]; the standard Orca Flash 4.0 V3 has a lower QE
  read_noise_e: 0.7              # ASSUMED: Orca Fusion BT, slow ("ultra-quiet") readout; check the camera's test sheet
  wavelength_nm: 509             # EGFP emission (nucleus NLS-GFP and MCP-GFP), 488 nm excitation (the optional 488 nm line [Bruker])
loci:
  wavelengths_nm: [575, 665]     # ASSUMED dyes: promoter label in the 555 nm channel, enhancer label in the 638 nm channel
imaging_errors:
  flat_field: {vignette: 0.03, tilt: 0.01}          # ASSUMED small: the top-hat illumination is designed to be flat [Bruker]
  defocus: {rms_um: 0.03}                            # active focus correction: drift < 30 nm over 10 min [Bruker]
  # Sequential excitation: GFP leaks into the 555 nm channel only through cross-excitation at 555 nm:
  #   0.0042 (FPbase) x 0.062 / 0.717 (emission in a 570-620 nm band vs 500-550 nm) = 0.00036, at equal laser power and exposure.
  #   (Simultaneous excitation with the same filters would be ~0.086, i.e. 240 x more.)  GFP -> 638 channel: 0.0023 x 0.006 / 0.717 ~ 0.00002.
  #   locus0 dye -> 638 nm channel: ASSUMED 0.002 (depends on the red dye; not computed).
  crosstalk: {enabled: true, pairs: [["nucleus", "locus0", 0.00036], ["nucleus", "locus1", 0.00002], ["locus0", "locus1", 0.002]]}
  # the price of sequential colours: the loci move between the colour exposures. ASSUMED 0.15 s between colour starts (0.1 s exposure +
  # laser switching); order red -> far red -> GFP keeps the two locus colours next to each other
  sequential_colour: {enabled: true, order: ["locus0", "locus1", "nucleus"], delay_s: 0.15}
