[theme]
base = "dark"
primaryColor = "#14b8a6"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#152033"
textColor = "#e5e7eb"
font = "sans serif"

[server]
enableStaticServing = true      # serves app/static/ (the page background image) at /app/static/

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
