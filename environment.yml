name: simlive
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  # OpenMM CUDA build. Pinned to CUDA 12.x: the 3090 driver (CUDA 13.2) runs 12.x runtimes,
  # and OpenMM/CuPy/PyTorch wheels are most reliably available for 12.x.
  - cuda-version=12.6
  - openmm>=8.1
  - cupy
  # CUDA headers so CuPy can JIT-compile kernels (see scripts/cuda_path.bat for CUDA_PATH).
  - cuda-cudart-dev
  - cuda-nvrtc-dev
  - cuda-cccl
  - numpy
  - scipy
  - matplotlib
  - pandas
  - h5py
  - joblib
  - cython
  - pyyaml
  - pytest
  - pip:
      # PyTorch CUDA wheels (conda's pytorch channel is deprecated).
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch
      - torchvision
      # Installed after torch so pip keeps the CUDA build.
      - trackastra
      - -e .
# polychrom is not on PyPI and its Cython extension needs MSVC, so it is installed afterwards by
#   powershell -File scripts/install_polychrom.ps1
