[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simlive"
version = "0.1.0"
description = "Simulation-based validation of live-cell chromatin locus analysis"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# GPU tests (torch/OpenMM/CuPy) and the numba/scikit-image tests cannot share one Python process on Windows (DLL / OpenMP
# clashes), so plain `pytest` runs the CPU tests only; run the GPU ones with `pytest -m gpu` (or scripts\run_tests.cmd).
addopts = "-m 'not gpu'"
markers = ["gpu: requires the NVIDIA GPU"]
