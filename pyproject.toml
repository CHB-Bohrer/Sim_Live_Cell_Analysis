[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simlive"
version = "0.1.0"
description = "Simulation-based validation of live-cell chromatin locus analysis"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires the NVIDIA GPU"]
